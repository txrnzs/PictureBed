<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="920" viewBox="0 0 1600 920">
  <defs>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#d9342b"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#266db4"/>
    </marker>
    <marker id="arrowPurple" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#6a4c93"/>
    </marker>
    <g id="fibers" fill="#718aa5" stroke="#172838" stroke-width="3">
      <circle cx="105" cy="105" r="34"/>
      <circle cx="265" cy="82" r="34"/>
      <circle cx="430" cy="125" r="34"/>
      <circle cx="555" cy="72" r="34"/>
      <circle cx="185" cy="245" r="34"/>
      <circle cx="370" cy="252" r="34"/>
      <circle cx="535" cy="285" r="34"/>
      <circle cx="92" cy="405" r="34"/>
      <circle cx="275" cy="405" r="34"/>
      <circle cx="470" cy="430" r="34"/>
      <circle cx="180" cy="555" r="34"/>
      <circle cx="425" cy="565" r="34"/>
    </g>
    <g id="gridLines" fill="none" stroke="#5d7185" stroke-opacity="0.24" stroke-width="1">
      <path d="M38.75 0V620 M77.5 0V620 M116.25 0V620 M155 0V620 M193.75 0V620 M232.5 0V620 M271.25 0V620 M310 0V620 M348.75 0V620 M387.5 0V620 M426.25 0V620 M465 0V620 M503.75 0V620 M542.5 0V620 M581.25 0V620"/>
      <path d="M0 38.75H620 M0 77.5H620 M0 116.25H620 M0 155H620 M0 193.75H620 M0 232.5H620 M0 271.25H620 M0 310H620 M0 348.75H620 M0 387.5H620 M0 426.25H620 M0 465H620 M0 503.75H620 M0 542.5H620 M0 581.25H620"/>
    </g>
  </defs>

  <rect width="1600" height="920" fill="#ffffff"/>
  <text x="800" y="58" text-anchor="middle" font-family="Arial, sans-serif" font-size="42" font-weight="700" fill="#172838">S3-RVE-T-V1 two-phase periodic thermal model</text>
  <text x="800" y="91" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#4b5c6b">same registered microstructure, two independent steady corrector solves</text>

  <!-- x-gradient cell -->
  <g transform="translate(135,145)">
    <text x="310" y="-22" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#172838">x-gradient case</text>
    <rect x="0" y="0" width="620" height="620" rx="2" fill="#f7e8c9" stroke="#172838" stroke-width="4"/>
    <rect x="0" y="0" width="180" height="620" fill="#ef5b48" fill-opacity="0.34"/>
    <rect x="440" y="0" width="180" height="620" fill="#4d93d2" fill-opacity="0.34"/>
    <use href="#gridLines"/>
    <use href="#fibers"/>
    <g stroke="#d9342b" stroke-width="5" marker-end="url(#arrowRed)">
      <line x1="65" y1="185" x2="145" y2="185"/>
      <line x1="255" y1="195" x2="335" y2="195"/>
      <line x1="430" y1="205" x2="510" y2="205"/>
      <line x1="125" y1="350" x2="205" y2="350"/>
      <line x1="345" y1="365" x2="425" y2="365"/>
      <line x1="485" y1="520" x2="565" y2="520"/>
    </g>
    <text x="15" y="35" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#a51d17">hot</text>
    <text x="605" y="35" text-anchor="end" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#1d5b9f">cold</text>
    <line x1="18" y1="642" x2="595" y2="642" stroke="#d9342b" stroke-width="5" marker-end="url(#arrowRed)"/>
    <text x="310" y="670" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#172838">Gₓ = (1, 0) K/m</text>
    <path d="M-20,230 C-55,250 -55,370 -20,390" fill="none" stroke="#6a4c93" stroke-width="3" marker-end="url(#arrowPurple)"/>
    <path d="M640,390 C675,370 675,250 640,230" fill="none" stroke="#6a4c93" stroke-width="3" marker-end="url(#arrowPurple)"/>
    <path d="M395,640 C370,675 250,675 225,640" fill="none" stroke="#1b8a89" stroke-width="3" marker-end="url(#arrowPurple)"/>
  </g>

  <!-- y-gradient cell -->
  <g transform="translate(845,145)">
    <text x="310" y="-22" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#172838">y-gradient case</text>
    <rect x="0" y="0" width="620" height="620" rx="2" fill="#f7e8c9" stroke="#172838" stroke-width="4"/>
    <rect x="0" y="0" width="620" height="180" fill="#ef5b48" fill-opacity="0.34"/>
    <rect x="0" y="440" width="620" height="180" fill="#4d93d2" fill-opacity="0.34"/>
    <use href="#gridLines"/>
    <use href="#fibers"/>
    <g stroke="#d9342b" stroke-width="5" marker-end="url(#arrowRed)">
      <line x1="155" y1="65" x2="155" y2="145"/>
      <line x1="310" y1="145" x2="310" y2="225"/>
      <line x1="500" y1="80" x2="500" y2="160"/>
      <line x1="115" y1="315" x2="115" y2="395"/>
      <line x1="360" y1="335" x2="360" y2="415"/>
      <line x1="535" y1="455" x2="535" y2="535"/>
    </g>
    <text x="15" y="35" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#a51d17">hot</text>
    <text x="15" y="600" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#1d5b9f">cold</text>
    <line x1="655" y1="18" x2="655" y2="595" stroke="#d9342b" stroke-width="5" marker-end="url(#arrowRed)"/>
    <text x="310" y="670" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#172838">Gᵧ = (0, 1) K/m</text>
    <path d="M-20,230 C-55,250 -55,370 -20,390" fill="none" stroke="#6a4c93" stroke-width="3" marker-end="url(#arrowPurple)"/>
    <path d="M640,390 C675,370 675,250 640,230" fill="none" stroke="#6a4c93" stroke-width="3" marker-end="url(#arrowPurple)"/>
    <path d="M395,640 C370,675 250,675 225,640" fill="none" stroke="#1b8a89" stroke-width="3" marker-end="url(#arrowPurple)"/>
  </g>

  <!-- legend and equations -->
  <g transform="translate(185,846)" font-family="Arial, sans-serif" fill="#172838">
    <circle cx="0" cy="0" r="22" fill="#718aa5" stroke="#172838" stroke-width="3"/>
    <text x="38" y="7" font-size="21">T300 fiber: k = 10.5 W/(m·K)</text>
    <rect x="355" y="-22" width="44" height="44" fill="#f7e8c9" stroke="#172838" stroke-width="2"/>
    <text x="415" y="7" font-size="21">PA6 resin: k = 0.25 W/(m·K)</text>
    <text x="800" y="7" font-size="21">12 fibers · diameter 7 μm · perfect thermal contact</text>
  </g>
  <text x="800" y="895" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" fill="#354a5d">q = −k∇T  ∇·q = 0  K_eff eᵢ = −⟨qᵢ⟩  formal FV mesh ladder: 16×16 / 24×24 / 32×32</text>
</svg>
